name: Meteor Android - Minecraft 26.2 CI

on:
  push:
    branches:
      - mc-26.2-fixed
  pull_request:
    branches:
      - mc-26.2-fixed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meteor-android-26-2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Meteor Android for Minecraft 26.2
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew --no-daemon build -Pcommit=${{ github.sha }} -Pbuild_number=0

      - name: Upload built JARs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: meteor-android-mc-26.2-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
